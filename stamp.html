<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>내 스탬프판 · 2026 파주 과학잼(JAM)</title>
<meta name="description" content="과학잼 스탬프 투어 스탬프판. 부스에서 인증받고 기념품을 받아가세요." />
<link rel="icon" href="assets/img/favicon.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-body">

<header class="app-bar">
  <div class="wrap app-bar__inner">
    <a class="app-bar__back" href="index.html">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M14 6l-6 6 6 6" class="l"/></svg>
      축제 홈
    </a>
    <span class="app-bar__title">내 스탬프판</span>
    <img src="assets/img/jam-jar-small.png" alt="" width="26" height="31" />
  </div>
</header>

<main class="app">

  <!-- 스탬프판 -->
  <section class="card">
    <div class="sheet__top">
      <div>
        <label class="field__label" for="nickname">이름 / 별명</label>
        <input class="sheet__name" id="nickname" type="text" placeholder="이름 입력" maxlength="12" />
      </div>
      <p class="sheet__count"><b id="total">0</b> / <span id="minTotal">5</span>개<br />모은 스탬프</p>
    </div>

    <div class="bar"><div class="bar__fill" id="bar" style="width:0%"></div></div>

    <div class="slots" id="slots"></div>
  </section>

  <!-- 기념품 인증 -->
  <section class="card gift" id="giftCard" hidden>
    <p class="card__title">기념품 받을 준비 완료!</p>
    <p class="card__desc">운영본부 안내 부스에서 아래 번호를 보여주세요.</p>
    <p class="gift__code" id="giftCode">------</p>
    <p class="gift__hint">기념품은 선착순이며 준비 수량이 소진되면 종료됩니다.</p>
  </section>

  <!-- 참여 기록 -->
  <section class="card">
    <details class="log" id="logBox">
      <summary>참여 기록 보기</summary>
      <ul id="logList"></ul>
    </details>
    <p class="card__desc" style="margin-top:14px">
      스탬프는 이 휴대폰에만 저장됩니다. 브라우저 기록을 지우거나 시크릿 모드를 쓰면 사라지니
      행사 중에는 이 페이지를 닫지 말고 열어두세요.
    </p>
    <button class="btn btn--ghost btn--sm" id="resetBtn" style="margin-top:12px">스탬프판 초기화</button>
  </section>

</main>

<!-- 하단 고정 버튼 -->
<div class="dock">
  <div class="dock__inner">
    <button class="btn btn--primary btn--block" id="openModal">스탬프 받기</button>
  </div>
</div>

<!-- 비밀번호 입력 모달 -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal__panel">
    <h2 class="modal__title" id="modalTitle">부스 선생님께 보여주세요</h2>
    <p class="modal__desc">체험을 마친 뒤, 부스 담당 선생님이 인증 비밀번호를 입력하면 스탬프가 찍힙니다.</p>

    <label class="field">
      <span class="field__label">인증 비밀번호</span>
      <input class="input" id="pw" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호 입력" />
    </label>

    <p class="msg" id="modalMsg" hidden></p>

    <div class="modal__row">
      <button class="btn btn--ghost" id="closeModal">닫기</button>
      <button class="btn btn--primary" id="submitPw">확인</button>
    </div>
  </div>
</div>

<script src="data/config.js"></script>
<script src="js/hash.js"></script>
<script src="js/stamp.js"></script>
</body>
</html>
